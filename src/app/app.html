<!-- ========================================================================== -->
<!-- FINDIMO SPA - ARQUITECTURA MODULAR DE COMPONENTES LIMPIA Y ELEGANTE       -->
<!-- Solo 50 líneas: cada vista y sección reside en su propio componente Angular -->
<!-- ========================================================================== -->

<!-- 1. BARRA DE NAVEGACIÓN SUPERIOR (NAVBAR) -->
<app-navbar
  [vistaActual]="vistaActual"
  [usuarioActual]="usuarioActual"
  [menuUsuarioAbierto]="menuUsuarioAbierto"
  (irAInicio)="irAInicio()"
  (irABusqueda)="irABusqueda()"
  (irAPerfil)="irAPerfil($event)"
  (irAResenas)="irAResenas($event)"
  (toggleMenuUsuario)="toggleMenuUsuario()"
  (abrirLogin)="abrirModalLogin()"
  (abrirRegistro)="abrirModalRegistro()"
  (abrirPublicar)="abrirModalPublicar()"
  (cerrarSesion)="cerrarSesion()">
</app-navbar>

<!-- 2. VISTAS PRINCIPALES DE LA SPA -->
<main>
  <!-- VISTA 1: INICIO (HERO, BUSCADOR PRINCIPAL, SERVICIOS, TESTIMONIOS) -->
  <app-vista-inicio
    *ngIf="vistaActual === 'inicio'"
    [(heroUbicacion)]="heroUbicacion"
    [(heroTipo)]="heroTipo"
    [(heroPrecio)]="heroPrecio"
    [propiedadesFiltradas]="propiedadesFiltradas"
    [testimonios]="testimonios"
    (buscarDesdeHero)="buscarDesdeHero()"
    (irABusqueda)="irABusqueda()"
    (abrirModalRegistro)="abrirModalRegistro()"
    (verDetalles)="verDetalles($event)"
    (toggleFavorito)="toggleFavorito($event.prop, $event.event)">
  </app-vista-inicio>

  <!-- VISTA 2: BÚSQUEDA DE CUARTOS (DISEÑO FIGMA EN CHORRILLOS) -->
  <app-vista-busqueda
    *ngIf="vistaActual === 'busqueda'"
    [(filtroTipoHabitacion)]="filtroTipoHabitacion"
    [(filtroPrecioMensual)]="filtroPrecioMensual"
    [(filtroUniversidad)]="filtroUniversidad"
    [propiedadesFiltradas]="propiedadesFiltradas"
    [propiedadesRecomendadas]="propiedadesRecomendadas"
    (irAInicio)="irAInicio()"
    (abrirModalFiltros)="abrirModalFiltros()"
    (ejecutarBusqueda)="ejecutarBusqueda()"
    (limpiarFiltros)="limpiarFiltros()"
    (verDetalles)="verDetalles($event)"
    (toggleFavorito)="toggleFavorito($event.prop, $event.event)">
  </app-vista-busqueda>

  <!-- VISTA 3: DETALLE DE HABITACIÓN (DISEÑO FIGMA HABITACIÓN ILUMINADA UPC) -->
  <app-vista-detalle
    *ngIf="vistaActual === 'detalle'"
    [propiedadSeleccionada]="propiedadSeleccionada"
    [resenasPropiedadSeleccionada]="resenasPropiedadSeleccionada"
    [(filtroResenaActivo)]="filtroResenaActivo"
    [propiedadesComparacion]="propiedadesComparacion"
    [propiedadesRecomendadas]="propiedadesRecomendadas"
    (toggleFavorito)="toggleFavorito($event)"
    (reservaInmediata)="reservaInmediata()"
    (reservarVisita)="reservarVisita()"
    (contactarArrendador)="contactarArrendador()"
    (verDetalles)="verDetalles($event)"
    (mostrarToast)="mostrarToast($event.mensaje, $event.tipo)">
  </app-vista-detalle>

  <!-- VISTA 4: PERFIL DEL ESTUDIANTE / CONFIGURACIÓN DE CUENTA (DISEÑOS FIGMA 1 Y 2) -->
  <app-vista-perfil
    *ngIf="vistaActual === 'perfil'"
    [usuarioActual]="usuarioActual"
    [modoInicial]="modoPerfil"
    (irAResenas)="irAResenas($event)"
    (perfilActualizado)="onPerfilActualizado($event)"
    (mostrarToast)="mostrarToast($event.mensaje, $event.tipo)">
  </app-vista-perfil>

  <!-- VISTA 5: RESEÑAS QUE ESCRIBISTE Y RESEÑAS QUE TE DEJARON ARRENDADORES (DISEÑO FIGMA 3) -->
  <app-vista-resenas
    *ngIf="vistaActual === 'resenas'"
    [pestanaActiva]="pestanaResenas"
    (volverAlPerfil)="irAPerfil('resumen')">
  </app-vista-resenas>
</main>

<!-- 3. PIE DE PÁGINA (FOOTER AZUL MARINO) -->
<app-footer (abrirPublicar)="abrirModalPublicar()"></app-footer>

<!-- 4. MODALES E INTERACCIONES FLOTANTES -->
<!-- Modal de Filtros Avanzados (US15 - findimo-modal-filtros) -->
<app-modal-filtros
  [modalFiltrosAbierto]="modalFiltrosAbierto"
  [serviciosDisponibles]="serviciosDisponibles"
  [serviciosExtra]="serviciosExtra"
  [serviciosSeleccionados]="serviciosSeleccionados"
  [mostrarMasServicios]="mostrarMasServicios"
  [opcionesReservacionDisponibles]="opcionesReservacionDisponibles"
  [opcionesReservacionSeleccionadas]="opcionesReservacionSeleccionadas"
  [alojamientoDestacadoSeleccionado]="alojamientoDestacadoSeleccionado"
  [tipoPropiedadExpandido]="tipoPropiedadExpandido"
  [filtroTipoPropiedadModal]="filtroTipoPropiedadModal"
  [accesibilidadExpandido]="accesibilidadExpandido"
  [filtroAccesibilidadModal]="filtroAccesibilidadModal"
  (cerrarModalFiltros)="cerrarModalFiltros()"
  (toggleServicio)="toggleServicio($event)"
  (toggleMostrarMasServicios)="toggleMostrarMasServicios()"
  (toggleOpcionReservacion)="toggleOpcionReservacion($event)"
  (seleccionarDestacado)="seleccionarDestacado($event)"
  (toggleTipoPropiedadModal)="toggleTipoPropiedadModal()"
  (toggleAccesibilidadModal)="toggleAccesibilidadModal()"
  (seleccionarTipoPropiedadModal)="filtroTipoPropiedadModal = $event"
  (seleccionarAccesibilidadModal)="filtroAccesibilidadModal = ($event === filtroAccesibilidadModal ? '' : $event)"
  (limpiarFiltrosAvanzados)="limpiarFiltrosAvanzados()"
  (aplicarFiltrosAvanzados)="aplicarFiltrosAvanzados()">
</app-modal-filtros>

<!-- Modal de Autenticación: Login y Registro -->
<app-modal-auth
  [modalLoginAbierto]="modalLoginAbierto"
  [modalRegistroAbierto]="modalRegistroAbierto"
  [(loginCorreo)]="loginCorreo"
  [(loginContrasena)]="loginContrasena"
  [(loginRol)]="loginRol"
  [(regNombre)]="regNombre"
  [(regApellido)]="regApellido"
  [(regCorreo)]="regCorreo"
  [(regContrasena)]="regContrasena"
  [(regTelefono)]="regTelefono"
  [(regRol)]="regRol"
  [(regUniversidad)]="regUniversidad"
  [(regPresupuesto)]="regPresupuesto"
  [(regCuentaBancaria)]="regCuentaBancaria"
  (cerrarLogin)="modalLoginAbierto = false"
  (cerrarRegistro)="modalRegistroAbierto = false"
  (iniciarSesion)="iniciarSesion()"
  (iniciarComoSofia)="iniciarComoSofia()"
  (iniciarComoEduardo)="iniciarComoEduardo()"
  (registrarUsuario)="registrarUsuario()">
</app-modal-auth>

<!-- Modal para Publicar Habitación (Arrendador) -->
<app-modal-publicar
  [modalPublicarAbierto]="modalPublicarAbierto"
  [(pubTitulo)]="pubTitulo"
  [(pubDescripcion)]="pubDescripcion"
  [(pubPrecio)]="pubPrecio"
  [(pubHabitaciones)]="pubHabitaciones"
  [(pubDireccion)]="pubDireccion"
  [(pubDistrito)]="pubDistrito"
  [(pubTipo)]="pubTipo"
  (cerrarModalPublicar)="modalPublicarAbierto = false"
  (guardarPropiedad)="guardarPropiedad()">
</app-modal-publicar>

<!-- Notificación Toast Flotante -->
<app-toast
  [toastMensaje]="toastMensaje"
  [toastTipo]="toastTipo"
  (cerrarToast)="cerrarToast()">
</app-toast>
