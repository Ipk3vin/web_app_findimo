<!-- Modal: findimo-modal-filtros (Figma: Búsqueda avanzada con más filtros - US15) -->
<div class="modal-backdrop-overlay" *ngIf="modalFiltrosAbierto" (click)="cerrarModalFiltros.emit()">
  <div class="findimo-filter-modal-dialog" (click)="$event.stopPropagation()">
    <!-- Header: Botón X a la izquierda y Título "Filtros" centrado en azul marino -->
    <div class="filter-modal-header">
      <button type="button" class="btn-filter-modal-close" (click)="cerrarModalFiltros.emit()" aria-label="Cerrar filtros">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#162b4d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <h3 class="filter-modal-title">Filtros</h3>
      <div class="filter-modal-header-spacer"></div>
    </div>

    <div class="filter-modal-body">
      @if (cargandoCatalogos) {
        <p role="status">Cargando opciones…</p>
      } @else if (errorCatalogos) {
        <p role="status">No se pudieron cargar las opciones.</p>
        <button type="button" class="btn-link-details" (click)="reintentarCatalogos.emit()">Reintentar</button>
      } @else {
        <section class="filter-section-block">
          <h4 class="filter-section-heading">Tipo de propiedad</h4>
          <div class="filter-chips-wrap">
            <button type="button" class="filter-pill-chip" [class.chip-active]="tipoSeleccionado === 'todos'"
              [attr.aria-pressed]="tipoSeleccionado === 'todos'" (click)="tipoSeleccionadoChange.emit('todos')">Todos los tipos</button>
            @for (tipo of catalogos.tipos; track tipo.id) {
              <button type="button" class="filter-pill-chip" [class.chip-active]="tipoSeleccionado === tipo.id.toString()"
                [attr.aria-pressed]="tipoSeleccionado === tipo.id.toString()"
                (click)="tipoSeleccionadoChange.emit(tipo.id.toString())">{{ tipo.nombre }}</button>
            }
          </div>
        </section>
        <section class="filter-section-block">
          <h4 class="filter-section-heading">Servicios</h4>
          <div class="filter-chips-wrap">
            @for (servicio of catalogos.servicios; track servicio.id) {
              <button type="button" class="filter-pill-chip" [class.chip-active]="serviciosSeleccionados.includes(servicio.id)"
                [attr.aria-pressed]="serviciosSeleccionados.includes(servicio.id)"
                (click)="toggleServicio.emit(servicio.id)">{{ servicio.nombre }}</button>
            }
          </div>
        </section>
      }
    </div>

    <div class="filter-modal-footer">
      <button type="button" class="btn-clear-filters-link" (click)="limpiarFiltrosAvanzados.emit()">
        Limpiar filtros
      </button>
      <button type="button" class="btn-apply-filters-orange" (click)="aplicarFiltrosAvanzados.emit()">
        Guardar filtros
      </button>
    </div>
  </div>
</div>
