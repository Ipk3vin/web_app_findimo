<header class="navbar-wrapper">
  <div class="navbar-container">
    <!-- Logotipo FINDIMO con isotipo de casa y punto naranja • -->
    <a href="javascript:void(0)" class="brand-logo" (click)="irAInicio.emit()" aria-label="FINDIMO Inicio">
      <div class="logo-icon">
        <svg class="roof-svg" viewBox="0 0 40 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 18L20 4L36 18" stroke="#00b4b6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 11V6H16V7.5" stroke="#00b4b6" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <div class="pin-dot"></div>
      </div>
      <span class="logo-text">FINDIMO</span>
      <span class="logo-orange-dot">•</span>
    </a>

    <!-- Enlaces de navegación con control reactivo de vista activa -->
    <nav class="nav-links">
      <a href="javascript:void(0)" class="nav-link" [class.active]="vistaActual === 'inicio'" (click)="irAInicio.emit()">Inicio</a>
      <a href="javascript:void(0)" class="nav-link" [class.active]="vistaActual === 'busqueda' || vistaActual === 'detalle'" (click)="irABusqueda.emit()">Propiedades</a>
      <a href="javascript:void(0)" class="nav-link" (click)="irAInicio.emit()">Nosotros</a>
      <a href="javascript:void(0)" class="nav-link" (click)="irAInicio.emit()">Beneficios</a>
      <a href="#contacto" class="nav-link">Contacto</a>
    </nav>

    <!-- Mini píldora central de búsqueda en la barra (visible en vista detalle según Figma) -->
    <div class="header-search-mini-pill" *ngIf="vistaActual === 'detalle'">
      <button type="button" class="btn-back-to-search" (click)="irABusqueda.emit()" title="Volver a la búsqueda">
        <span class="mini-pill-tag">Chorrillos, Lima</span>
        <span class="mini-pill-sep">|</span>
        <span class="mini-pill-sub">Habitación</span>
        <div class="mini-pill-search-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>
      </button>
    </div>

    <!-- Menú de Usuario y Avatar (Figma: Píldora con borde turquesa suave, hamburguesa turquesa y foto redonda) -->
    <div class="nav-actions">
      <div class="user-control-pill" [class.pill-active]="menuUsuarioAbierto" (click)="toggleMenuUsuario.emit()">
        <!-- Ícono hamburguesa con viñetas / lista de 3 líneas con puntos (estilo exacto captura 4) -->
        <div class="pill-hamburger-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00b4b6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="9" y1="6" x2="20" y2="6"/>
            <line x1="9" y1="12" x2="20" y2="12"/>
            <line x1="9" y1="18" x2="20" y2="18"/>
            <circle cx="4.5" cy="6" r="1" fill="#00b4b6"/>
            <circle cx="4.5" cy="12" r="1" fill="#00b4b6"/>
            <circle cx="4.5" cy="18" r="1" fill="#00b4b6"/>
          </svg>
        </div>

        <!-- Foto / Avatar del usuario -->
        <div class="user-avatar-wrapper">
          <img
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80"
            alt="Usuario Findimo"
            class="user-avatar-img"
          />
        </div>
      </div>

      <!-- Menú Desplegable Flotante (Exacto al diseño de la imagen 4) -->
      <div class="user-dropdown-menu" *ngIf="menuUsuarioAbierto">
        <!-- Opciones principales -->
        <div class="dropdown-section">
          <!-- 1. Listas de favoritos -->
          <button type="button" class="dropdown-item" (click)="irABusqueda.emit()">
            <svg class="dropdown-item-icon" viewBox="0 0 24 24" fill="none" stroke="#102a43" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span class="dropdown-item-text">Listas de favoritos</span>
          </button>

          <!-- 2. Mensajes -->
          <button type="button" class="dropdown-item" (click)="irAResenas.emit('sobreTi')">
            <svg class="dropdown-item-icon" viewBox="0 0 24 24" fill="none" stroke="#102a43" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <span class="dropdown-item-text">Mensajes</span>
          </button>

          <!-- 3. Perfil -->
          <button type="button" class="dropdown-item" (click)="irAPerfil.emit('resumen')">
            <svg class="dropdown-item-icon" viewBox="0 0 24 24" fill="none" stroke="#102a43" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span class="dropdown-item-text">Perfil</span>
          </button>
        </div>

        <div class="dropdown-divider"></div>

        <div class="dropdown-section">
          <!-- 4. Configuración de la cuenta -->
          <button type="button" class="dropdown-item" (click)="irAPerfil.emit('detalle')">
            <svg class="dropdown-item-icon" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span class="dropdown-item-text">Configuración de la cuenta</span>
          </button>

          <!-- 5. Centro de ayuda -->
          <a href="#contacto" class="dropdown-item" (click)="toggleMenuUsuario.emit()">
            <svg class="dropdown-item-icon" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <span class="dropdown-item-text">Centro de ayuda</span>
          </a>
        </div>

        <div class="dropdown-divider"></div>

        <!-- Banner: Conviértete en anfitrión -->
        <div class="dropdown-host-card" (click)="abrirPublicar.emit()">
          <h4 class="host-title">Conviértete en anfitrión</h4>
          <p class="host-desc">¡Empieza a anfitrionar y genera ingresos adicionales, ¡es muy sencillo!</p>
          <div class="host-banner-preview">
            <img
              src="https://images.unsplash.com/photo-1556911220-e15b29be8c8f?auto=format&fit=crop&w=400&q=80"
              alt="Conviértete en anfitrión"
              class="host-banner-img"
            />
          </div>
        </div>

        <div class="dropdown-divider"></div>

        <!-- Cierra la sesión -->
        <div class="dropdown-section">
          <button type="button" class="dropdown-item logout-item" (click)="cerrarSesion.emit()">
            <svg class="dropdown-item-icon logout-icon" viewBox="0 0 24 24" fill="none" stroke="#f26422" stroke-width="2.2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span class="logout-text">Cierra la sesión</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
